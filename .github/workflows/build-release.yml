name: Build Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      # 分步执行并把完整输出写入日志文件，失败时通过 ::error:: 上报到运行摘要，
      # 便于在 Actions 页面直接看到真正的报错原因
      - name: Build web & electron
        id: web
        continue-on-error: true
        shell: pwsh
        run: |
          npm run build:electron *> build.log 2>&1
          echo "web_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # duckdb 使用 N-API，编译产物是 ABI 稳定的，可直接在 Electron 中复用，
      # 因此通过 package.json 的 npmRebuild:false 跳过原生模块重建，无需 MSVC/VS 编译链。
      - name: Package installer (electron-builder)
        id: pkg
        continue-on-error: true
        shell: pwsh
        run: |
          npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath eb.log
          echo "pkg_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Surface electron-builder log to annotations
        if: always() && steps.pkg.outcome == 'failure'
        shell: pwsh
        run: |
          if (Test-Path eb.log) {
            echo "::error::=== electron-builder log (last 120 lines) ==="
            $lines = Get-Content eb.log | Select-Object -Last 120
            foreach ($l in $lines) { echo "::error::$l" }
            echo "::error::=== END ==="
          } else {
            echo "::error::no eb.log produced"
          }

      - name: Upload electron-builder log
        if: always() && steps.pkg.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eb-log
          path: eb.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always() && steps.pkg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

      - name: Upload installer to Release
        if: steps.pkg.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          generate_release_notes: true

      # 国内用户访问 GitHub Releases 较慢，因此把同一批产物同步上传到 Gitee Release 做镜像分发。
      # 需要预先在仓库 Settings → Secrets 里配置：
      #   - GITEE_REPO ：Gitee 仓库，格式 "用户名/仓库名"（不填则回退用 GitHub 仓库名）
      #   - GITEE_TOKEN ：Gitee 私人令牌（https://gitee.com/profile/personal_access_tokens，需勾选 releases 权限）
      # Gitee 仓库需与 GitHub 保持同步（尤其是 tag），否则 release 创建会失败。
      - name: Upload installer to Gitee Release
        if: steps.pkg.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Host "::warning::GITEE_TOKEN 未配置，跳过 Gitee 镜像上传"
            exit 0
          }

          $fullRepo = if ($env:GITEE_REPO) { $env:GITEE_REPO } else { $env:GH_REPO }
          $base = "https://gitee.com/api/v5/repos/$fullRepo/releases"
          $tagEndpoint = "$base/tags/$env:TAG"

          # 1. 按 tag 查找 release，不存在则创建
          $releaseId = $null
          try {
            $rel = Invoke-RestMethod -Method Get -Uri "$tagEndpoint?access_token=$env:GITEE_TOKEN"
            $releaseId = $rel.id
            Write-Host "Gitee release exists (id=$releaseId)"
          } catch {
            $body = @{
              access_token = $env:GITEE_TOKEN
              tag_name     = $env:TAG
              name         = "Release $env:TAG"
              body         = "自动发布 $env:TAG"
            } | ConvertTo-Json
            $created = Invoke-RestMethod -Method Post -Uri $base -ContentType 'application/json' -Body $body
            $releaseId = $created.id
            Write-Host "Gitee release created (id=$releaseId)"
          }

          # 2. 上传所有安装产物
          $files = Get-ChildItem -Path 'release' -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          foreach ($f in $files) {
            Write-Host "Uploading $($f.Name) to Gitee..."
            Invoke-RestMethod -Method Post -Uri "$base/$releaseId/attach_files" -Form @{
              access_token = $env:GITEE_TOKEN
              file         = Get-Item $f.FullName
            }
          }
          Write-Host "::notice::Gitee 镜像上传完成，共 $($files.Count) 个文件"

      # 再把产物上传到自有阿里云服务器（国内直连，速度最快）。
      # 需要在仓库 Settings → Secrets 里配置：
      #   - ALIYUN_HOST   服务器 IP/域名
      #   - ALIYUN_USER   服务器 SSH 用户名
      #   - ALIYUN_PASS   服务器 SSH 密码
      #   - ALIYUN_REMOTE_DIR（可选，默认 /usr/share/nginx/html/downloads）
      # 说明：密码按字面存入 Secret 即可，脚本用 SFTP 上传；若服务器开了仅密钥登录，建议改用 SSH 私钥方案。
      - name: Upload installer to Aliyun server
        if: steps.pkg.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PASS }}
          REMOTE_DIR: ${{ secrets.ALIYUN_REMOTE_DIR }}
        run: |
          python -m pip install --quiet paramiko
          python .github/scripts/upload_to_server.py