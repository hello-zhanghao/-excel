name: Build Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      # 分步执行并把完整输出写入日志文件，失败时通过 ::error:: 上报到运行摘要，
      # 便于在 Actions 页面直接看到真正的报错原因
      - name: Build web & electron
        id: web
        continue-on-error: true
        shell: pwsh
        run: |
          npm run build:electron *> build.log 2>&1
          echo "web_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package installer (electron-builder)
        id: pkg
        continue-on-error: true
        shell: pwsh
        run: |
          npx electron-builder --win --publish never *>> build.log 2>&1
          echo "pkg_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Surface build log to annotations
        if: always() && (steps.web.outcome == 'failure' || steps.pkg.outcome == 'failure')
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { echo "::error::no build.log produced"; exit 0 }
          $lines = Get-Content build.log | Select-Object -Last 100
          foreach ($l in $lines) { echo "::error::$l" }
          echo "::error::=== END OF LOG ==="

      - name: Upload build log
        if: always() && (steps.web.outcome == 'failure' || steps.pkg.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always() && steps.pkg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

      - name: Upload installer to Release
        if: steps.pkg.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          generate_release_notes: true